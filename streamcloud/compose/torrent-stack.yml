services:
  gluetun:
    image: docker.io/qmcgaw/gluetun:latest
    cap_add: [NET_ADMIN]
    devices: [/dev/net/tun]
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WG_KEY}
      - SERVER_COUNTRIES=Switzerland
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Allow LAN + Tailscale to reach qBittorrent WebUI
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,100.64.0.0/10
      # ProtonVPN rotates the forwarded port on every reconnect — push it into
      # qBittorrent, else it stays on a stale port that gluetun firewalls off.
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh /scripts/sync-qbit-port.sh {{PORTS}}
    volumes:
      - ${HOME}/Projects/self-hosted-apps/streamcloud/scripts/sync-qbit-port.sh:/scripts/sync-qbit-port.sh:ro
    ports:
      - 8080:8080
    restart: unless-stopped

  qbittorrent:
    image: docker.io/linuxserver/qbittorrent:latest
    network_mode: "service:gluetun"
    userns_mode: keep-id
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - WEBUI_PORT=8080
      - UMASK=002
    volumes:
      - /srv/media/video:/data
      - ${HOME}/Projects/self-hosted-apps/streamcloud/config/qbit:/config
    restart: unless-stopped
    depends_on:
      - gluetun

  flaresolverr:
    image: docker.io/21hsmw/flaresolverr:nodriver
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Kolkata
    ports:
      - 127.0.0.1:8191:8191
    restart: unless-stopped
