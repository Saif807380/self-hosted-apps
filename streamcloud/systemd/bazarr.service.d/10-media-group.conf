# Put Bazarr in the media group so it can write subtitles next to the video files.
#
# The Arch package ships Group=bazarr, while sonarr/radarr/prowlarr all ship
# Group=media. /srv/media is drwxrwsr-x root:media, so Bazarr could read the
# library but every save failed with PermissionError(13) and not one subtitle
# was ever written.
#
# Worse, Bazarr downloads a subtitle *before* it writes it, so each failed save
# still spent one OpenSubtitles download. It burned the ~20/day free-tier cap on
# files it then discarded, tripped DownloadLimitExceeded, and repeated daily.
#
# The media directories are setgid, so new files inherit group media on their
# own; the packaged UMask=0002 override already makes them group-writable.
#
# Install to /etc/systemd/system/bazarr.service.d/10-media-group.conf

[Service]
Group=media
