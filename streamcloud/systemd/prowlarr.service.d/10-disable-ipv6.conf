# Force Prowlarr's outbound requests onto IPv4.
#
# FlareSolverr runs in a rootless podman container that has no IPv6, so it
# egresses via the host's public IPv4 and the cf_clearance cookie Cloudflare
# issues is bound to that address. Prowlarr does not use FlareSolverr's solved
# HTML — it takes the cookie and replays the request from its own HTTP stack,
# and .NET's Happy Eyeballs prefers IPv6. The replay therefore came from a
# different address than the one the cookie was issued to, and Cloudflare
# answered 403: every Cloudflare-fronted indexer failed with "blocked by
# CloudFlare Protection" no matter how well FlareSolverr was working.
#
# DOTNET_SYSTEM_NET_DISABLEIPV6 drops AAAA records in System.Net.NameResolution,
# so Prowlarr and FlareSolverr share one egress IP and the cookie validates.
#
# Install to /etc/systemd/system/prowlarr.service.d/10-disable-ipv6.conf
# Side effect: Prowlarr's WebUI listener becomes IPv4-only. Reach it over LAN
# or the Tailscale 100.64.0.0/10 address, not a Tailscale IPv6 address.

[Service]
Environment=DOTNET_SYSTEM_NET_DISABLEIPV6=1
