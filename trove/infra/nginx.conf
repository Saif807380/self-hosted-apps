# HTTP — backward compatible for local development
server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    # Strip /api prefix before forwarding to backend (matches Vite dev proxy behaviour)
    location /api/ {
        proxy_pass https://127.0.0.1:9000/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Forward /uploads/ as-is — backend serves at the same path
    location /uploads/ {
        proxy_pass https://127.0.0.1:9000;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS — for phone access over hotspot
server {
    listen 3443 ssl;
    http2 on;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;

    ssl_certificate     /etc/nginx/certs/cachyos.tail4f0f0b.ts.net.crt;
    ssl_certificate_key /etc/nginx/certs/cachyos.tail4f0f0b.ts.net.key;

    location /api/ {
        proxy_pass https://127.0.0.1:9000/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass https://127.0.0.1:9000;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
