syntax = "proto3";

package trove.v1.gaming;

option go_package = "github.com/saifkazi/trove/backend/gen/trove/v1/gaming;gamingv1";

// An IGDB game, as offered when searching or choosing a match.
message CatalogGame {
  int64           igdb_id   = 1;
  string          title     = 2;
  int32           year      = 3; // 0 when unreleased
  string          cover_url = 4;
  repeated string platforms = 5; // pc | ps4 | ps5 | switch | switch2
}

message SearchCatalogRequest {
  string query = 1;
}

message SearchCatalogResponse {
  repeated CatalogGame games = 1;
}

// LinkGame ties a Trove game to the IGDB game you chose, replacing any
// automatic or unresolved match, and queues a price refresh.
message LinkGameRequest {
  string video_game_id = 1;
  int64  igdb_id       = 2;
}

message LinkGameResponse {}

// RefreshGame asks the worker to look the game up again now.
message RefreshGameRequest {
  string video_game_id = 1;
}

message RefreshGameResponse {}

// SetPsnLink sets the PS Store link to a pasted product page, or back to a
// search link when url is empty.
message SetPsnLinkRequest {
  string video_game_id = 1;
  string url           = 2;
}

message SetPsnLinkResponse {}

message GetGameInsightsRequest {
  string video_game_id = 1;
}

// A price held from `from` until `until` (the last time it was seen).
// Amounts are in minor units of the listing's currency.
message PriceRun {
  string from         = 1;
  string until        = 2;
  int64  base_minor   = 3;
  int64  final_minor  = 4;
  int32  discount_pct = 5;
  optional string sale_ends_at = 6;
}

message Listing {
  string            id             = 1;
  string            store          = 2; // steam | eshop | psn
  string            edition        = 3; // e.g. "Switch 2"; empty when only one
  string            title          = 4;
  string            url            = 5;
  string            currency       = 6;
  bool              is_search_link = 7; // PS Store search rather than a product page
  repeated PriceRun history        = 8; // oldest first; the last run is the current price
  optional int64    lowest_minor   = 9;
}

message GetGameInsightsResponse {
  string               match_status        = 1; // none | picked | auto | unresolved
  optional CatalogGame match               = 2;
  repeated CatalogGame candidates          = 3; // unresolved only
  repeated Listing     listings            = 4;
  double               usd_to_inr          = 5; // 0 if not fetched yet
  optional string      listings_checked_at = 6;
  optional DeviceVerdict verdict           = 7;
  bool                 verdicts_enabled    = 8; // false: no API key, so no verdict is coming
}

// Which of your devices to play a game on.
message DeviceVerdict {
  string                summary     = 1;
  repeated DeviceRating devices     = 2; // best first
  repeated string       unavailable = 3; // pc | ps5 | switch2 the game isn't released for
  repeated Source       sources     = 4;
  bool                  complete    = 5; // false: some evidence was missing; it's redone later
  string                created_at  = 6;
}

message DeviceRating {
  string          device  = 1; // pc | ps5 | switch2
  string          rating  = 2; // great | good | playable | avoid
  string          expect  = 3; // e.g. "1080p, medium settings, ~60 fps"
  repeated string reasons = 4;
}

message Source {
  string label = 1;
  string url   = 2;
}

// The VAPID public key a browser needs to subscribe. enabled is false when
// the server has no keys, in which case alerts can't be turned on.
message GetPushConfigRequest {}

message GetPushConfigResponse {
  bool   enabled    = 1;
  string public_key = 2;
}

// A browser's PushSubscription (endpoint and keys from toJSON()).
message SubscribePushRequest {
  string endpoint = 1;
  string p256dh   = 2;
  string auth     = 3;
}

message SubscribePushResponse {}

message UnsubscribePushRequest {
  string endpoint = 1;
}

message UnsubscribePushResponse {}

// Sends a test notification to every subscribed browser.
message SendTestPushRequest {}

message SendTestPushResponse {
  int32 delivered = 1;
}

message ListDealsRequest {}

// A wishlisted game's listing that's discounted right now. Amounts are in
// minor units of the listing's currency.
message Deal {
  string          video_game_id = 1;
  string          store         = 2; // steam | eshop
  string          edition       = 3; // e.g. "Switch 2"; empty when only one
  string          url           = 4;
  string          currency      = 5;
  int64           base_minor    = 6;
  int64           final_minor   = 7;
  int32           discount_pct  = 8;
  optional string sale_ends_at  = 9;
  bool            lowest        = 10; // the lowest price Trove has seen for it
}

message ListDealsResponse {
  repeated Deal deals      = 1; // biggest discount first
  double        usd_to_inr = 2; // 0 if not fetched yet
}

service GamingService {
  rpc SearchCatalog   (SearchCatalogRequest)   returns (SearchCatalogResponse);
  rpc LinkGame        (LinkGameRequest)        returns (LinkGameResponse);
  rpc RefreshGame     (RefreshGameRequest)     returns (RefreshGameResponse);
  rpc SetPsnLink      (SetPsnLinkRequest)      returns (SetPsnLinkResponse);
  rpc GetGameInsights (GetGameInsightsRequest) returns (GetGameInsightsResponse);
  rpc ListDeals       (ListDealsRequest)       returns (ListDealsResponse);
  rpc GetPushConfig   (GetPushConfigRequest)   returns (GetPushConfigResponse);
  rpc SubscribePush   (SubscribePushRequest)   returns (SubscribePushResponse);
  rpc UnsubscribePush (UnsubscribePushRequest) returns (UnsubscribePushResponse);
  rpc SendTestPush    (SendTestPushRequest)    returns (SendTestPushResponse);
}
